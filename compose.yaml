name: dango

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dango
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - dango-postgres:/var/lib/postgresql/data

volumes:
  dango-postgres:
    name: dango-postgres
